services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4-alpine
    container_name: kate-lavalink
    restart: unless-stopped
    ports:
      - "2333:2333"
    expose:
      - 2333
    environment:
      - _JAVA_OPTIONS=-Xmx2G
      - LAVALINK_SERVER_PASSWORD=youshallnotpass
      - LAVALINK_SERVER_BINDADDRESS=0.0.0.0
    volumes:
      - ../application.yml:/opt/Lavalink/application.yml
      - ../sounds:/opt/Lavalink/sounds
    networks:
      - kate-network
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=kate
      - POSTGRES_USER=kate
      - POSTGRES_PASSWORD=kate
    restart: unless-stopped
    networks:
      - kate-network
networks:
  kate-network:
    driver: bridge

volumes:
  postgres_data: