version: '3.8'

services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4-alpine
    container_name: kate-lavalink
    restart: unless-stopped
    ports:
      - "2333:2333"
    expose:
      - 2333
    environment:
      - _JAVA_OPTIONS=-Xmx2G
      - LAVALINK_SERVER_PASSWORD=youshallnotpass
      - LAVALINK_SERVER_BINDADDRESS=0.0.0.0
    volumes:
      - ../application.yml:/opt/Lavalink/application.yml
      - ../sounds:/opt/Lavalink/sounds
    networks:
      - kate-network
  chroma:
    image: chromadb/chroma:latest
    container_name: chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
    networks:
      - kate-network
networks:
  kate-network:
    driver: bridge

volumes:
  chroma_data: